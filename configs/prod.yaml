# 生产环境配置
# 通过 APP_ENV=prod 加载

otel:
  enabled: true
  endpoint: "http://otel-collector.prod.svc:4317"
  service_name: "platform-agent"
  service_version: "0.1.0"
  environment: "production"
  headers:
    authorization: "Bearer ${OTEL_TOKEN}"

llm:
  provider: "openai"
  api_key: "${LLM_API_KEY}"
  base_url: "${LLM_BASE_URL}"
  model: "${LLM_MODEL_NAME}"
  stream: true
  context_size: 128000
  max_tokens: 4096
  temperature: 0.7

auth:
  required: true
  api_key: "${API_KEY:-}"

server:
  host: "0.0.0.0"
  port: 9090
  workers: 0
  log_level: "INFO"
  log_dir: "logs"
  log_backup_count: 30

agent:
  name: "platform_agent"
  system_prompt: |
    你是一个能够处理复杂任务的 AI 助手，具备文件操作、代码编写、命令执行等能力。

    ## 工作原则

    **对于复杂任务，你必须：**
    1. 先用 TaskCreate 创建任务计划，将大任务拆解为可执行的子任务
    2. 按顺序逐个完成子任务，每完成一个用 TaskUpdate 标记为 completed
    3. 遇到问题时分析原因，调整方案，不要轻易放弃
    4. 如果发现新的子任务，随时用 TaskCreate 追加

    **对于简单任务（1-2 步即可完成），直接执行即可，不需要创建任务列表。**

    ## 能力范围
    - 读写编辑文件（Read/Write/Edit）
    - 执行命令（Bash）
    - 搜索文件（Glob）和内容（Grep）
    - 任务规划与跟踪（TaskCreate/TaskList/TaskGet/TaskUpdate）

    ## 注意事项
    - 执行危险命令前先确认（如 rm -rf、格式化等）
    - 写文件前先读取目标文件了解现有内容
    - 长时间运行的命令注意超时
    - 遇到不确定的操作，向用户确认
  max_iters: 50
  context_trigger_ratio: 0.8
  context_reserve_ratio: 0.1
  permission_mode: "auto"
  # 沙箱配置（三个均启用时：workspaces/{user_id}/ + 独立 skills/ + 独立 mcp/）
  sandbox_dir: "workspaces"
  sandbox_skills: false      # true 时 skills 从 sandbox_dir/skills/ 加载
  sandbox_mcp: false         # true 时 MCP 配置从 sandbox_dir/mcp/ 加载
  sandbox_per_user: true    # true 时沙箱路径追加 user_id 层级（workspaces/{user_id}/）
  # tool_guard 的匹配规则为已知有缺陷的实现，可能在生产环境产生误判或漏拦，
  # 故在此显式禁用，命令安全过滤以 command_guard 为准（见下）。
  tool_guard:
    enabled: false
    mode: "blocklist"
    tools:
      - "Bash:rm -rf *"

  # 命令内容级安全守卫：生产环境必须开启，防止危险命令执行
  command_guard:
    enabled: true
    mode: "blocklist"           # allowlist | blocklist
    rules:
      - "rm -rf /"              # 拦截删根目录
      - "rm -rf ~"              # 拦截删 home
      - "rm -rf /*"             # 拦截删根目录通配
      - "*|*bash*"              # 拦截管道执行 shell
      - "*|*sh*"                # 拦截管道执行 sh
      - "*/dev/tcp/*"           # 拦截 Bash 反弹 shell
      - "Invoke-Expression*"    # 拦截 PowerShell 远程执行
      - "certutil*"             # 拦截 Windows 下载
      - "curl *|*"              # 拦截 curl 管道 (curl 下载可以，管道不行)

mcp_servers: []

database:
  url: "${DATABASE_URL:-}"
  pool_size: 20

redis:
  url: "${REDIS_URL:-redis://localhost:6379/0}"

# 沙箱配置
sandbox:
  backend: "${SANDBOX_BACKEND:-local}"
  container: "platform-sandbox"
  project_root: "/workspace"
  fallback_to_local: false
  extra_mounts:
    - host: "skills"
      container: "/workspace/skills"
      readonly: true
