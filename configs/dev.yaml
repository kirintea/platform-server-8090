# 开发环境配置
# 通过 APP_ENV=dev 加载 (默认)

otel:
  enabled: false
  endpoint: "${OTEL_ENDPOINT:-http://localhost:4317}"
  service_name: "platform-agent"
  service_version: "0.1.0"
  environment: "development"
  headers: {}

llm:
  provider: "openai"
  api_key: "${LLM_API_KEY}"
  base_url: "${LLM_BASE_URL}"
  model: "${LLM_MODEL_NAME:-glm-5}"
  stream: true
  context_size: 128000
  max_tokens: 4096
  temperature: 0.7

server:
  host: "0.0.0.0"
  port: 8090
  workers: 1
  log_level: "DEBUG"
  log_dir: "logs"
  log_backup_count: 7

agent:
  name: "platform_agent"
  system_prompt: |
    你是一个能够处理复杂任务的 AI 助手，具备文件操作、代码编写、命令执行等能力。

    ## 工作原则

    **对于复杂任务，你必须：**
    1. 先用 TaskCreate 创建任务计划，将大任务拆解为可执行的子任务
    2. 按顺序逐个完成子任务，每完成一个用 TaskUpdate 标记为 completed
    3. 遇到问题时分析原因，调整方案，不要轻易放弃
    4. 如果发现新的子任务，随时用 TaskCreate 追加

    **对于简单任务（1-2 步即可完成），直接执行即可，不需要创建任务列表。**

    ## 能力范围
    - 读写编辑文件（Read/Write/Edit）
    - 执行命令（Bash）
    - 搜索文件（Glob）和内容（Grep）
    - 任务规划与跟踪（TaskCreate/TaskList/TaskGet/TaskUpdate）

    ## 注意事项
    - 执行危险命令前先确认（如 rm -rf、格式化等）
    - 写文件前先读取目标文件了解现有内容
    - 长时间运行的命令注意超时
    - 遇到不确定的操作，向用户确认
  max_iters: 50
  context_trigger_ratio: 0.8
  context_reserve_ratio: 0.1
  permission_mode: "bypass"
  # 沙箱配置（三个均启用时：workspaces/{user_id}/ + 独立 skills/ + 独立 mcp/）
  sandbox_dir: "workspaces"
  sandbox_skills: false      # true 时 skills 从 sandbox_dir/skills/ 加载
  sandbox_mcp: false         # true 时 MCP 配置从 sandbox_dir/mcp/ 加载
  sandbox_per_user: true    # true 时沙箱路径追加 user_id 层级（workspaces/{user_id}/）
  tool_guard:
    enabled: false
    mode: "allowlist" # allowlist | blocklist
    tools: []

  command_guard:
    enabled: false
    mode: "blocklist"           # allowlist | blocklist
    rules:
      - "rm -rf /"              # 拦截删根目录
      - "rm -rf ~"              # 拦截删 home
      - "rm -rf /*"             # 拦截删根目录通配
      - "*|*bash*"              # 拦截管道执行 shell
      - "*|*sh*"                # 拦截管道执行 sh
      - "*/dev/tcp/*"           # 拦截 Bash 反弹 shell
      - "Invoke-Expression*"    # 拦截 PowerShell 远程执行
      - "certutil*"             # 拦截 Windows 下载
      - "curl *|*"              # 拦截 curl 管道 (curl 下载可以，管道不行)

  # 工具管理器 — 从 configs/tools.yaml 选择性加载工具
  tool_manager:
    config_path: "configs/tools.yaml"

# MCP 服务列表 (可选)
mcp_servers: []
  # - name: "filesystem"
  #   transport: "stdio"
  #   command: "npx"
  #   args: ["-y", "@modelcontextprotocol/server-filesystem", "/workspace"]

database:
  url: "${DATABASE_URL:-postgresql://user:password@localhost:5432/ragdb}"
  pool_size: 10

redis:
  url: "${REDIS_URL:-redis://localhost:6390/0}"
  key_prefix: "agentscope:session:"
  session_ttl: 1800
