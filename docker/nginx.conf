# Nginx 反向代理 — 多实例负载均衡
#
# 用法：
#   由 docker-compose.multi-instance.yaml 中的 nginx 服务加载
#   宿主机访问 http://localhost:8090 → 转发到 platform-server 容器组

upstream platform_servers {
    # least_conn: 将新请求发给当前连接数最少的后端
    # 适合长连接（SSE / WebSocket）场景，避免 round-robin 偏斜
    least_conn;

    # docker compose --scale platform-server=N 时，
    # 同一服务的多个实例会自动注册到同一个网络别名。
    # 这里用 DNS 别名 platform-server，compose 内部 DNS 会解析到所有副本。
    server platform-server:8090;
}

server {
    listen 80;
    server_name _;

    # --- 对话 SSE 流式端点 ---
    # 需要禁用缓冲，否则 SSE 事件会被 Nginx 攒一批再发
    location /chat/stream {
        proxy_pass http://platform_servers;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;

        # SSE 关键：禁用缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # --- SSE 事件流订阅端点 ---
    location /sessions/ {
        proxy_pass http://platform_servers;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # --- WebSocket 端点 ---
    location /ws/ {
        proxy_pass http://platform_servers;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- 默认：所有其他请求 ---
    location / {
        proxy_pass http://platform_servers;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;

        proxy_read_timeout 120s;
    }
}
