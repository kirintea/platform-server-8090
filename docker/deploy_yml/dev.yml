# Python 开发容器 - 用于本地开发和调试
# 端口：9621（自定义端口，可按需映射为 Web 服务 / 调试端口）
# 项目目录挂载到容器内 /workspace，代码改动实时同步

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.base
    # 保持容器运行，进入后手动执行命令
    command: sleep infinity
    stdin_open: true
    tty: true
    ports:
      - "9621:9621"  # 自定义端口，供外部访问容器内服务
    volumes:
      # 将宿主机当前项目目录挂载到容器内 /workspace
      - ./:/workspace
    working_dir: /workspace
    environment:
      # pip 国内镜像源，加速包安装
      PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
      PIP_TRUSTED_HOST: mirrors.aliyun.com
    healthcheck:
      # 开发容器无默认服务，仅检查容器进程是否存活
      test: ["CMD-SHELL", "pgrep -f 'sleep infinity'"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    stop_grace_period: 30s
    restart: unless-stopped
