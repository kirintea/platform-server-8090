# MinIO 对象存储 - 用于文件和数据存储
# 端口：9000（API端口），9090（控制台端口）
# 访问密钥：minioadmin，密码：minioadmin（仅限本地开发使用）

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9090"
    ports:
      - "19000:9000"    # MinIO API 端口，供应用程序连接
      - "19090:9090"    # MinIO 控制台端口，供浏览器访问
    volumes:
      # 持久化数据目录
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -f http://localhost:9000/minio/health/live || exit 1'
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  # 使用显式命名卷，支持跨项目复用同一份数据
  minio_data:
    name: minio_shared_data