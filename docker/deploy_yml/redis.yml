# Redis 内存数据库 - 用于缓存和会话存储
# 端口：6379（Redis 协议）
# 无密码，仅限本地开发使用

services:
  redis:
    image: redis:7-alpine
    # 使用命令行参数替代外部配置文件，避免挂载不存在的文件导致启动失败
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"  # Redis 协议端口，供应用程序连接
    volumes:
      # 持久化数据目录，开启 AOF 后数据写入此卷
      - redis_data:/data
    healthcheck:
      # 通过检查 6379 端口的 TCP 连接判断服务是否就绪
      test:
        - CMD-SHELL
        - 'PORT_HEX="$(printf ''%04X'' 6379)"; cat /proc/net/tcp /proc/net/tcp6 2>/dev/null | grep -q ":$${PORT_HEX} "'
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  # 使用显式命名卷，支持跨项目复用同一份数据
  redis_data:
    name: redis_shared_data
