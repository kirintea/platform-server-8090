# otel-collector-dev.yaml
# OTel Collector 配置 - 本地开发环境
# 数据流: Agent → OTLP(4317) → Collector → Jaeger/Prometheus/Loki

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024

exporters:
  # Trace → Jaeger (通过 OTLP 协议，Jaeger 原生支持)
  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # Metrics → Prometheus 拉取端点
  prometheus:
    endpoint: 0.0.0.0:8889

  # Logs → Loki (via OTLP HTTP, 原生 loki exporter 已在新版 contrib 中移除)
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

service:
  telemetry:
    logs:
      level: "info"
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_grpc/jaeger]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/loki]
