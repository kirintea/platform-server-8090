# prometheus.yml
# Prometheus 抓取配置

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 抓取 OTel Collector 暴露的 Prometheus 指标
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  # 抓取 Prometheus 自身指标
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
